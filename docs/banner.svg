<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Wholphin+ — every server, one remote">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b18"/>
      <stop offset="0.55" stop-color="#1a1430"/>
      <stop offset="1" stop-color="#2b1d52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="20" fill="url(#glow)"/>
  <!-- three stacked "server" cards, echoing the source picker -->
  <g transform="translate(905 74)" opacity="0.95">
    <rect x="0" y="0" width="290" height="44" rx="10" fill="#1e1e2a" stroke="#a78bfa" stroke-width="2.5"/>
    <rect x="16" y="15" width="34" height="14" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="58" y="15" width="44" height="14" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="110" y="15" width="30" height="14" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="232" y="13" width="44" height="18" rx="5" fill="#a78bfa"/>
    <rect x="12" y="58" width="270" height="40" rx="10" fill="#ffffff" opacity="0.06"/>
    <rect x="28" y="71" width="34" height="14" rx="4" fill="#ffffff" opacity="0.4"/>
    <rect x="70" y="71" width="44" height="14" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="12" y="110" width="270" height="40" rx="10" fill="#ffffff" opacity="0.045"/>
    <rect x="28" y="123" width="34" height="14" rx="4" fill="#ffffff" opacity="0.3"/>
    <rect x="70" y="123" width="44" height="14" rx="4" fill="#ffffff" opacity="0.22"/>
  </g>
  <text x="72" y="150" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f5f3ff" letter-spacing="-1.5">Wholphin<tspan fill="url(#plus)">+</tspan></text>
  <text x="76" y="198" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c9c3e6">Every server. One remote.</text>
  <text x="76" y="238" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#8f88b3" letter-spacing="2">PLEX  ·  EMBY  ·  JELLYFIN  —  FOR ANDROID TV</text>
</svg>
