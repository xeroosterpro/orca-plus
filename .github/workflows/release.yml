# Builds Orca+ for the newest Wholphin release and publishes it, so installed copies get an
# in-app update prompt. Runs every 6 hours (to catch new Wholphin releases), on every push, and
# by hand. If hooks.patch stops applying to a new Wholphin release, this run fails and GitHub
# emails the repo owner.
name: Release

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # History was squashed after r8; keep release numbers increasing (see build.sh)
  REV_OFFSET: 10

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh numbers versions by commit count

      # Cheap check first: skip the ~15 min build unless Wholphin released or this repo changed.
      - name: Anything new?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHOLPHIN=$(git ls-remote --tags --refs https://github.com/damontecres/Wholphin 'v*' \
            | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          TAG="${WHOLPHIN}-r$(( $(git rev-list --count HEAD) + REV_OFFSET ))"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.check.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        if: steps.check.outputs.build == 'true'
        env:
          # The Orca+ cloud for the official build only (forks build without one)
          ORCA_CLOUD_URL: ${{ secrets.ORCA_CLOUD_URL }}
          PUBLIC: "1"
          REPO: ${{ github.repository }}
          SHIELD: ""
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: ./build.sh latest

      - name: Publish
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          # The title is what Wholphin's updater compares (vX.Y.Z-<revision>-g<hash>)
          V=$(cat dist/release/VERSION)
          WHOLPHIN=${V%%-*}
          {
            echo "Orca+ built on Wholphin $WHOLPHIN."
            echo
            # A push publishes its own news: the commit's message (a scheduled rebuild for a new
            # Wholphin release has none of its own)
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              git log -1 --format=%B | sed '/^Co-Authored-By/d'
              echo
            fi
            echo "**New install:** download Wholphin-release.apk on the TV (e.g. with the Downloader app) and install it."
            echo "**Already installed:** Orca+ offers this update itself (Install update, at the top of Settings)."
            echo
            echo "Source: this repository at ${GITHUB_SHA::7}. Wholphin: https://github.com/damontecres/Wholphin/releases/tag/$WHOLPHIN"
            echo
            echo "**Source code:** the complete source for this build (Wholphin $WHOLPHIN with the Orca+ changes applied) is attached as Orca-plus-source-$V.zip."
          } > notes.md
          # Complete corresponding source for this exact build (GPL): patched Wholphin + the addon
          zip -qr "dist/release/Orca-plus-source-$V.zip" upstream addon hooks.patch build.sh NOTICE LICENSE LICENSES README.md \
            -x 'upstream/.git/*' '*/build/*' '*/.gradle/*' 'upstream/local.properties' 'addon/build/*'
          gh release create "$TAG" dist/release/*.apk "dist/release/Orca-plus-source-$V.zip" --title "$V" --notes-file notes.md
